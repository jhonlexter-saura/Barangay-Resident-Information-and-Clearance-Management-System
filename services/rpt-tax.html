<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySerbisyo — Real Property Tax</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --emerald: #16a34a; --emerald-light: #e8f5e8; --emerald-dark: #14532d;
            --white: #ffffff; --border: #e2e8f0; --gray-50: #f8fafc; --gray-100: #f1f5f9;
            --gray-200: #e2e8f0; --text-dark: #1e293b; --text-mid: #475569;
            --text-muted: #64748b;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9; color: var(--text-mid);
        }

        .r-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Hero Section */
        .svc-page-hero {
            background: linear-gradient(100deg, #16a34a 0%, #22c55e 100%);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; color: white;
        }
        .svc-hero-title { font-family: 'Lora', serif; font-size: 1.5rem; margin: 0 0 0.3rem 0; }
        .svc-hero-sub { font-size: 0.8rem; color: rgba(255,255,255,0.85); margin: 0; }

        /* Layout */
        .svc-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; }
        .svc-form-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .svc-form-body { padding: 1.5rem; }

        /* Form Controls */
        .svc-field-section { margin-bottom: 1.5rem; }
        .svc-field-section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; display: block; border-bottom: 1px solid var(--gray-100); padding-bottom: 4px; }
        
        .svc-input { width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; background: var(--gray-50); }
        .svc-input:focus { border-color: var(--emerald); outline: none; background: white; }
        .svc-input.error { border-color: #ef4444; }

        /* Sidebar & Button */
        .btn-add-cart { 
            width: 100%; background: linear-gradient(135deg, var(--emerald), var(--emerald-dark)); border: none; 
            border-radius: 9px; color: white; padding: 0.85rem; font-weight: 700; font-size: 0.88rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-add-cart.added { background: #10b981; }

        @media (max-width: 768px) { .svc-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <main class="r-content">
        <div class="svc-page-hero">
            <h1 class="svc-hero-title">Real Property Tax</h1>
            <p class="svc-hero-sub">Online assessment and payment of Amilyar.</p>
        </div>

        <div class="svc-layout">
            <div class="svc-form-card">
                <div class="svc-form-body">
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Tax Declaration Number</label>
                        <input type="text" class="svc-input" id="rptTaxDec" placeholder="e.g. E-012-00001" required>
                        <p style="font-size: 0.65rem; color: var(--text-muted); margin-top: 5px;">
                            You can find this number on your previous tax receipt or assessment.
                        </p>
                    </div>
                </div>
            </div>

            <div class="svc-sidebar">
                <div style="background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px;">
                        <span>Assessment Fee</span>
                        <span style="font-weight: 700; color: var(--emerald);">Varies</span>
                    </div>
                    <div style="font-size: 0.65rem; color: var(--text-muted); line-height: 1.3;">
                        Total tax will be computed based on the property's assessed value.
                    </div>
                </div>
                <button class="btn-add-cart" id="addCartBtn" onclick="handleRPTCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </main>

    <script>
        const CART_KEY = 'lgu_cart';

        function handleRPTCart() {
            const taxDec = document.getElementById('rptTaxDec');

            if (!taxDec.value.trim()) {
                taxDec.classList.add('error');
                alert('Please enter your Tax Declaration Number.');
                return;
            } else {
                taxDec.classList.remove('error');
            }

            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            // Check for duplicate TDN
            if (cart.find(item => item.formData && item.formData.taxDec === taxDec.value.trim())) {
                alert('This Tax Declaration is already in your cart.');
                return;
            }

            const item = {
                id: Date.now(),
                name: `RPT: ${taxDec.value.trim()}`,
                fee: -1, // Represents "Varies/Computed"
                feeLabel: 'Computed',
                icon: 'bi-cash-coin',
                iconBg: '#e8f5e8',
                iconColor: '#16a34a',
                addedAt: new Date().toISOString(),
                formData: {
                    taxDec: taxDec.value.trim()
                }
            };

            cart.push(item);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));

            const btn = document.getElementById('addCartBtn');
            btn.classList.add('added');
            btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Added to Cart!';
            btn.disabled = true;
        }
    </script>
</body>
</html>

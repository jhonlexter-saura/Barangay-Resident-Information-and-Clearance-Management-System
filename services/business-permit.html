<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySerbisyo — Business Permit</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --amber: #d97706; --amber-light: #fef3c7; --amber-dark: #b45309;
            --white: #ffffff; --border: #e2e8f0; --gray-50: #f8fafc; --gray-100: #f1f5f9;
            --gray-200: #e2e8f0; --text-dark: #1e293b; --text-mid: #475569;
            --text-muted: #64748b; --red: #ef4444; --green: #10b981;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9; color: var(--text-mid);
        }

        .r-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Hero Section */
        .svc-page-hero {
            background: linear-gradient(100deg, #d97706 0%, #f59e0b 100%);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; color: white;
        }
        .svc-hero-title { font-family: 'Lora', serif; font-size: 1.5rem; margin: 0 0 0.3rem 0; }
        .svc-hero-sub { font-size: 0.8rem; color: rgba(255,255,255,0.85); margin: 0; }

        /* Layout */
        .svc-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; }
        .svc-form-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .svc-form-body { padding: 1.5rem; }

        /* Form Controls */
        .svc-field-section { margin-bottom: 1.5rem; }
        .svc-field-section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; display: block; border-bottom: 1px solid var(--gray-100); padding-bottom: 4px; }
        
        .svc-input { width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; }
        .svc-input:focus { border-color: var(--amber); outline: none; }
        .svc-input.error { border-color: var(--red); }

        /* Radio Group */
        .svc-radio-group { display: flex; gap: 20px; padding: 5px 0; }
        .svc-radio-group label { font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .svc-radio-group input[type="radio"] { cursor: pointer; accent-color: var(--amber); }

        /* Sidebar & Button */
        .svc-sidebar { position: sticky; top: 20px; }
        .btn-add-cart { 
            width: 100%; background: linear-gradient(135deg, var(--amber), var(--amber-dark)); border: none; 
            border-radius: 9px; color: white; padding: 0.85rem; font-weight: 700; font-size: 0.88rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .btn-add-cart:active { transform: scale(0.98); }
        .btn-add-cart.added { background: var(--green); }

        @media (max-width: 768px) { .svc-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <main class="r-content">
        <div class="svc-page-hero">
            <h1 class="svc-hero-title">Business Permit</h1>
            <p class="svc-hero-sub">New application or renewal for local business operations.</p>
        </div>

        <div class="svc-layout">
            <div class="svc-form-card">
                <div class="svc-form-body">
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Application Type</label>
                        <div class="svc-radio-group">
                            <span>
                                <input type="radio" name="bizType" id="new" value="New" checked> 
                                <label for="new">New Application</label>
                            </span>
                            <span>
                                <input type="radio" name="bizType" id="renewal" value="Renewal"> 
                                <label for="renewal">Renewal</label>
                            </span>
                        </div>
                    </div>

                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Business Name</label>
                        <input type="text" class="svc-input" id="bizName" placeholder="Enter registered business name" required>
                    </div>
                </div>
            </div>

            <div class="svc-sidebar">
                <button class="btn-add-cart" id="addCartBtn" onclick="handleAddToCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
                <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 10px; text-align: center;">
                    <i class="bi bi-info-circle"></i> Fees will be computed after document verification.
                </p>
            </div>
        </div>
    </main>

    <script>
        const CART_KEY = 'lgu_cart';

        function handleAddToCart() {
            const bizName = document.getElementById('bizName');
            const bizType = document.querySelector('input[name="bizType"]:checked').value;

            // Simple Validation
            if (!bizName.value.trim()) {
                bizName.classList.add('error');
                alert('Please enter your Business Name.');
                return;
            } else {
                bizName.classList.remove('error');
            }

            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            // Prevent duplicates
            const serviceName = `Business Permit (${bizType})`;
            if (cart.find(item => item.name === serviceName)) {
                alert('This application is already in your cart.');
                return;
            }

            const item = {
                id: Date.now(),
                name: serviceName,
                fee: -1, // Logic for "Varies/Computed"
                feeLabel: 'Computed',
                icon: 'bi-house-fill',
                iconBg: '#fef3c7',
                iconColor: '#d97706',
                addedAt: new Date().toISOString(),
                formData: {
                    type: bizType,
                    businessName: bizName.value.trim()
                }
            };

            cart.push(item);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));

            // Button Feedback
            const btn = document.getElementById('addCartBtn');
            btn.classList.add('added');
            btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Added to Cart!';
            btn.disabled = true;
        }
    </script>
</body>
</html>

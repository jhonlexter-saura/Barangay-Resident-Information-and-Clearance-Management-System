<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySerbisyo — Community Tax Certificate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --green: #1a9e5f; --green-light: #e6f7ef; --green-dark: #166534;
            --white: #ffffff; --border: #e2e8f0; --gray-50: #f8fafc; --gray-100: #f1f5f9;
            --gray-200: #e2e8f0; --text-dark: #1e293b; --text-mid: #475569;
            --text-muted: #64748b; --sky: #1a7fd4;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9; color: var(--text-mid);
        }

        .r-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Hero Section */
        .svc-page-hero {
            background: linear-gradient(100deg, var(--green-dark) 0%, var(--green) 100%);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; color: white; position: relative; overflow: hidden;
        }
        .svc-hero-eyebrow { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 6px; }
        .svc-hero-title { font-family: 'Lora', serif; font-size: 1.5rem; margin: 0 0 0.3rem 0; }
        .svc-hero-sub { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin: 0; }
        
        .svc-hero-meta { position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%); text-align: right; }
        .svc-hero-fee { font-family: 'Lora', serif; font-size: 1.5rem; font-weight: 600; }
        .svc-hero-fee-label { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; }
        .svc-hero-time { font-size: 0.7rem; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 4px; justify-content: flex-end; }

        /* Layout */
        .svc-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; }
        .svc-form-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .svc-form-body { padding: 1.5rem; }

        /* Form Controls */
        .svc-field-section { margin-bottom: 1.5rem; }
        .svc-field-section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; display: block; border-bottom: 1px solid var(--gray-100); padding-bottom: 4px; }
        
        .svc-select, .svc-input { width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; background: var(--gray-50); }
        .svc-select:focus, .svc-input:focus { border-color: var(--green); outline: none; background: white; }

        /* Sidebar & Button */
        .svc-sidebar { position: sticky; top: 20px; }
        .btn-add-cart { 
            width: 100%; background: linear-gradient(135deg, var(--green), var(--green-dark)); border: none; 
            border-radius: 9px; color: white; padding: 0.85rem; font-weight: 700; font-size: 0.88rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.25s ease;
        }
        .btn-add-cart.added { background: var(--sky); }

        @media (max-width: 768px) { .svc-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <main class="r-content">
        <div class="svc-page-hero">
            <div class="svc-hero-eyebrow"><i class="bi bi-card-heading"></i> Taxes</div>
            <h1 class="svc-hero-title">Community Tax Certificate</h1>
            <p class="svc-hero-sub">Annual requirement for individuals and corporations.</p>
            <div class="svc-hero-meta">
                <div class="svc-hero-fee-label">Base Fee</div>
                <div class="svc-hero-fee">₱25.00+</div>
                <div class="svc-hero-time"><i class="bi bi-clock"></i> Same day</div>
            </div>
        </div>

        <div class="svc-layout">
            <div class="svc-form-card">
                <div class="svc-form-body">
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Employment Status</label>
                        <select class="svc-select" id="cedulaStatus">
                            <option value="Employed">Employed</option>
                            <option value="Self-Employed">Self-Employed / Business</option>
                            <option value="Unemployed">Unemployed / Student</option>
                        </select>
                    </div>
                    
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Annual Income (Optional for computation)</label>
                        <input type="number" class="svc-input" id="cedulaIncome" placeholder="0.00" min="0">
                    </div>
                </div>
            </div>

            <div class="svc-sidebar">
                <button class="btn-add-cart" id="addCartBtn" onclick="handleCedulaCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
                <div style="margin-top: 15px; background: #fffbeb; border-radius: 8px; padding: 12px; border: 1px solid #fef3c7;">
                    <p style="font-size: 0.72rem; color: #92400e; margin: 0; line-height: 1.4;">
                        <strong>Note:</strong> Final fee includes a ₱1.00 tax for every ₱1,000.00 of gross earnings.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const CART_KEY = 'lgu_cart';

        function handleCedulaCart() {
            const status = document.getElementById('cedulaStatus').value;
            const income = parseFloat(document.getElementById('cedulaIncome').value) || 0;
            
            // Basic Cedula Math (Base 25 + 1 per 1k income)
            const additionalTax = Math.floor(income / 1000);
            const totalFee = 25 + additionalTax;

            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            // Prevent duplicate Cedula requests
            if (cart.find(item => item.name === 'Cedula / CTC')) {
                alert('Cedula request is already in your cart.');
                return;
            }

            const item = {
                id: Date.now(),
                name: 'Cedula / CTC',
                fee: totalFee,
                feeLabel: `₱${totalFee.toFixed(2)}`,
                icon: 'bi-card-heading',
                iconBg: '#e6f7ef',
                iconColor: '#1a9e5f',
                addedAt: new Date().toISOString(),
                formData: {
                    employmentStatus: status,
                    declaredIncome: income
                }
            };

            cart.push(item);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));

            // UI Feedback
            const btn = document.getElementById('addCartBtn');
            btn.classList.add('added');
            btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Added to Cart!';
            btn.disabled = true;
        }
    </script>
</body>
</html>

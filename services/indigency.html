<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySerbisyo — Indigency Certificate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --purple: #7c3aed; --purple-light: #f0e8ff; --purple-dark: #5b21b6;
            --white: #ffffff; --border: #e2e8f0; --gray-50: #f8fafc; --gray-100: #f1f5f9;
            --gray-200: #e2e8f0; --text-dark: #1e293b; --text-mid: #475569;
            --text-muted: #64748b;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9; color: var(--text-mid);
        }

        .r-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Hero Section */
        .svc-page-hero {
            background: linear-gradient(100deg, #7c3aed 0%, #a78bfa 100%);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; color: white;
        }
        .svc-hero-title { font-family: 'Lora', serif; font-size: 1.5rem; margin: 0 0 0.3rem 0; }
        .svc-hero-sub { font-size: 0.8rem; color: rgba(255,255,255,0.85); margin: 0; }

        /* Layout */
        .svc-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; }
        .svc-form-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .svc-form-body { padding: 1.5rem; }

        /* Form Controls */
        .svc-field-section { margin-bottom: 1.5rem; }
        .svc-field-section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; display: block; border-bottom: 1px solid var(--gray-100); padding-bottom: 4px; }
        
        .svc-select { width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: var(--gray-50); box-sizing: border-box; }
        .svc-select:focus { border-color: var(--purple); outline: none; background: white; }

        /* Sidebar & Button */
        .btn-add-cart { 
            width: 100%; background: linear-gradient(135deg, var(--purple), var(--purple-dark)); border: none; 
            border-radius: 9px; color: white; padding: 0.85rem; font-weight: 700; font-size: 0.88rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-add-cart.added { background: #10b981; }

        @media (max-width: 768px) { .svc-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <main class="r-content">
        <div class="svc-page-hero">
            <h1 class="svc-hero-title">Indigency Certificate</h1>
            <p class="svc-hero-sub">For scholarship, medical, and legal aid assistance.</p>
        </div>

        <div class="svc-layout">
            <div class="svc-form-card">
                <div class="svc-form-body">
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Purpose of Request</label>
                        <select class="svc-select" id="indPurpose">
                            <option>Educational Assistance</option>
                            <option>Medical Assistance</option>
                            <option>Burial Assistance</option>
                            <option>Legal Aid / Public Attorney</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="svc-sidebar">
                <div style="background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                        <span>Service Fee</span>
                        <span style="font-weight: 700; color: var(--purple);">FREE</span>
                    </div>
                </div>
                <button class="btn-add-cart" id="addCartBtn" onclick="handleIndigencyCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
                <p style="font-size: 0.65rem; color: var(--text-muted); margin-top: 12px; text-align: center; line-height: 1.4;">
                    <i class="bi bi-info-circle"></i> Verification of your status may be required by the Barangay.
                </p>
            </div>
        </div>
    </main>

    <script>
        const CART_KEY = 'lgu_cart';

        function handleIndigencyCart() {
            const purpose = document.getElementById('indPurpose').value;
            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            // Allow multiple only if purpose is different, otherwise treat as duplicate
            const duplicate = cart.find(item => item.name === `Indigency Certificate (${purpose})`);
            if (duplicate) {
                alert('This specific request is already in your cart.');
                return;
            }

            const item = {
                id: Date.now(),
                name: `Indigency Certificate (${purpose})`,
                fee: 0,
                feeLabel: 'Free',
                icon: 'bi-people-fill',
                iconBg: '#f0e8ff',
                iconColor: '#7c3aed',
                addedAt: new Date().toISOString(),
                formData: {
                    purpose: purpose
                }
            };

            cart.push(item);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));

            // Button Feedback
            const btn = document.getElementById('addCartBtn');
            btn.classList.add('added');
            btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Added to Cart!';
            btn.disabled = true;
        }
    </script>
</body>
</html>

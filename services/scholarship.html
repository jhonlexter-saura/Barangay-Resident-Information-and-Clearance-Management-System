<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySerbisyo — Scholarship Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --ocean: #0369a1; --ocean-light: #e8f3fc; --ocean-dark: #075985;
            --white: #ffffff; --border: #e2e8f0; --gray-50: #f8fafc; --gray-100: #f1f5f9;
            --gray-200: #e2e8f0; --text-dark: #1e293b; --text-mid: #475569;
            --text-muted: #64748b; --red: #ef4444;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9; color: var(--text-mid);
        }

        .r-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        /* Hero Section */
        .svc-page-hero {
            background: linear-gradient(100deg, #0369a1 0%, #0ea5e9 100%);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; color: white;
        }
        .svc-hero-title { font-family: 'Lora', serif; font-size: 1.5rem; margin: 0 0 0.3rem 0; }
        .svc-hero-sub { font-size: 0.8rem; color: rgba(255,255,255,0.85); margin: 0; }

        /* Layout */
        .svc-layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; align-items: start; }
        .svc-form-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .svc-form-body { padding: 1.5rem; }

        /* Form Controls */
        .svc-field-section { margin-bottom: 1.5rem; }
        .svc-field-section-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; display: block; border-bottom: 1px solid var(--gray-100); padding-bottom: 4px; }
        
        .svc-select, .svc-input { width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: var(--gray-50); box-sizing: border-box; }
        .svc-select:focus, .svc-input:focus { border-color: var(--ocean); outline: none; background: white; }
        .svc-input.error { border-color: var(--red); }

        /* Sidebar & Button */
        .btn-add-cart { 
            width: 100%; background: linear-gradient(135deg, var(--ocean), var(--ocean-dark)); border: none; 
            border-radius: 9px; color: white; padding: 0.85rem; font-weight: 700; font-size: 0.88rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-add-cart.added { background: #10b981; }

        @media (max-width: 768px) { .svc-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <main class="r-content">
        <div class="svc-page-hero">
            <h1 class="svc-hero-title">Scholarship Program</h1>
            <p class="svc-hero-sub">LGU-funded educational assistance for qualified students.</p>
        </div>

        <div class="svc-layout">
            <div class="svc-form-card">
                <div class="svc-form-body">
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">Current Year Level</label>
                        <select class="svc-select" id="scholarLevel">
                            <option>Senior High School</option>
                            <option>College (1st Year)</option>
                            <option>College (2nd Year)</option>
                            <option>College (3rd Year)</option>
                            <option>College (4th Year)</option>
                        </select>
                    </div>
                    
                    <div class="svc-field-section">
                        <label class="svc-field-section-label">GWA (Last Semester)</label>
                        <input type="number" step="0.01" class="svc-input" id="scholarGwa" placeholder="0.00" min="1.00" max="5.00">
                        <p style="font-size: 0.65rem; color: var(--text-muted); margin-top: 5px;">
                            Please enter your General Weighted Average from the most recent term.
                        </p>
                    </div>
                </div>
            </div>

            <div class="svc-sidebar">
                <div style="background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px;">
                        <span>Application Fee</span>
                        <span style="font-weight: 700; color: var(--ocean);">FREE</span>
                    </div>
                    <div style="font-size: 0.65rem; color: var(--text-muted); line-height: 1.3;">
                        Applications are subject to screening and availability of funds.
                    </div>
                </div>
                <button class="btn-add-cart" id="addCartBtn" onclick="handleScholarCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </main>

    <script>
        const CART_KEY = 'lgu_cart';

        function handleScholarCart() {
            const level = document.getElementById('scholarLevel').value;
            const gwaInput = document.getElementById('scholarGwa');
            const gwaValue = parseFloat(gwaInput.value);

            // Simple validation
            if (!gwaValue || gwaValue < 1.0 || gwaValue > 5.0) {
                gwaInput.classList.add('error');
                alert('Please enter a valid GWA (1.00 - 5.00).');
                return;
            } else {
                gwaInput.classList.remove('error');
            }

            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            
            // Prevent duplicate applications
            if (cart.find(item => item.name === 'Scholarship Application')) {
                alert('A scholarship application is already in your cart.');
                return;
            }

            const item = {
                id: Date.now(),
                name: 'Scholarship Application',
                fee: 0,
                feeLabel: 'Free',
                icon: 'bi-mortarboard-fill',
                iconBg: '#e8f3fc',
                iconColor: '#0369a1',
                addedAt: new Date().toISOString(),
                formData: {
                    yearLevel: level,
                    gwa: gwaValue
                }
            };

            cart.push(item);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));

            const btn = document.getElementById('addCartBtn');
            btn.classList.add('added');
            btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Added to Cart!';
            btn.disabled = true;
        }
    </script>
</body>
</html>
